name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The newest stable Xcode already on the runner; no third-party action needed.
      - name: Select Xcode
        run: |
          XCODE="$(ls -d /Applications/Xcode_[0-9]*.app | grep -iv beta | sort -V | tail -1)"
          echo "Using $XCODE"
          sudo xcode-select -s "$XCODE/Contents/Developer"

      - name: Swift version
        run: swift --version

      - name: Test
        run: ./scripts/test.sh

      - name: Coverage (Core, 90% minimum)
        run: ./scripts/coverage.sh

      - name: Build (release)
        run: swift build -c release
